name: CI de Testes em C (Alpine)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: alpine 

    steps:
      - name: Checkout do código nativo
        run: wget -qO- http://192.168.237.65:3000/pablo/calculadora/archive/main.tar.gz | tar xvz --strip-components=1

      - name: Instalar GCC e dependências de compilação
        run: |
          apk update
          apk add --no-cache gcc musl-dev

      - name: Compilar o Projeto
        run: gcc calculadora.c test_calculadora.c -o suite_de_testes

      - name: Executar Testes Automatizados
        run: ./suite_de_testes